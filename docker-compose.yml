# Local development database only. Railway provides its own Postgres in staging.
services:
  db:
    image: postgres:17-alpine
    container_name: car-rental-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-car_rental_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-car_rental_password}
      POSTGRES_DB: ${POSTGRES_DB:-car_rental_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - car-rental-db-data:/var/lib/postgresql/data
      # Runs once, on first start of an empty volume: creates the separate test database.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-car_rental_user} -d ${POSTGRES_DB:-car_rental_db}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Local stand-in for the file bucket (Railway Storage Bucket on staging): texted-in files are copied here.
  # S3-compatible, so the app uses the same code. Create the bucket once with `npm run storage:init`.
  # Console (a web page to look inside): http://localhost:9001
  minio:
    # MinIO no longer publishes images on Docker Hub (2025); Chainguard keeps a free one (only "latest" is free).
    image: cgr.dev/chainguard/minio:latest
    container_name: car-rental-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - car-rental-minio-data:/data

volumes:
  car-rental-db-data:
  car-rental-minio-data:
